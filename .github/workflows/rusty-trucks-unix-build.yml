# Shared build for the Rusty Trucks Linux and macOS workflows (rusty-trucks-linux.yml, rusty-trucks-macos.yml; doc 44):
# builds the game, runs the engine and mod tests, packages it for players (the game, setup, SETUP.sh / PLAY.sh, docs)
# and attaches the package to the hails-additions release (pushes) or to the published release.
name: Rusty Trucks Unix build
on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      target:
        required: true
        type: string
      refpack:
        required: true
        type: string
permissions:
  contents: write
jobs:
  build:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 120
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/requirements-setup.txt
      # The libraries winit, wgpu and SDL3 build against (flake.nix linuxBuildLibs, as Ubuntu packages).
      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake clang patchelf pkg-config \
            libasound2-dev libudev-dev libvulkan-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxcb1-dev libxext-dev libxfixes-dev libxss-dev libxtst-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ inputs.target }}-release
          cache-on-failure: true
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Check setup tools
        run: |
          python -m pip install -r tools/requirements-setup.txt
          python -m unittest tools.asset_pipeline.test_dependency tools.asset_pipeline.test_versions -v
      - name: Build the game
        run: cargo build --release --locked -p skate-game --bin skate3rust --no-default-features
      - name: Build the launcher
        run: cargo build --release --locked -p skate-launcher
      - name: Engine tests
        run: cargo test --release --locked -p skate-core -p skate-audio -p skate-data --lib -- --test-threads=2
      - name: Mod tests
        run: cargo test --release --locked -p skate-mods --lib -- --test-threads=2
      - name: Native RefPack for setup
        run: |
          mkdir -p target/native
          rustc --edition 2024 --crate-type cdylib -C opt-level=3 -C panic=abort tools/asset_pipeline/refpack_native.rs -o target/native/${{ inputs.refpack }}
      # The player package: laid out like a checkout so SETUP.sh and PLAY.sh work in it unchanged.
      - name: Package for players
        run: |
          set -e
          name=skate3rust-${{ inputs.target }}
          d=out/$name
          mkdir -p "$d/bin" "$d/licenses"
          git archive HEAD -- tools ':!tools/claude-skills' ':!tools/dev-bench' ':!tools/recomp-trace' ':!tools/skate-launcher' \
            SETUP.sh PLAY.sh README.md \
            docs/images/skating-crab.png mods/Skyline_Drive_Mod | tar -x -C "$d"
          cp target/release/skate3rust "$d/bin/"
          # fast_refpack.py loads librefpack.so on every Unix (ctypes opens a .dylib by any name).
          cp target/native/${{ inputs.refpack }} "$d/tools/asset_pipeline/librefpack.so"
          cp tools/vendor/utt/LICENSE "$d/licenses/UTT.txt"
          cp tools/vendor/university/LICENSE-PROJECT.md "$d/licenses/CustomEngineLayer.txt"
          cp vendor/bevy_pbr/LICENSE-MIT "$d/licenses/Bevy-MIT.txt"
          cp vendor/bevy_pbr/LICENSE-APACHE "$d/licenses/Bevy-APACHE.txt"
          # The launcher (tools/skate-launcher) sits in its folder, where it finds its files and updates itself.
          cp target/release/skate-launcher "$d/tools/steam-launcher/skate-launcher"
          chmod +x "$d/bin/skate3rust" "$d/SETUP.sh" "$d/PLAY.sh" "$d/tools/steam-launcher/setup.sh" "$d/tools/steam-launcher/skate-launcher"
          printf 'build %s\ncommit %s\n' "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" > "$d/BUILD.txt"
          # release.json: what the launcher compares, checks and patches against (doc 44a "Patch updates")
          tag=${{ github.event_name == 'release' && github.event.release.tag_name || 'hails-additions' }}
          target/release/skate-launcher write-manifest "$d" --target ${{ inputs.target }} --build "$GITHUB_RUN_NUMBER" --revision "$GITHUB_SHA" --tag "$tag"
          cp "$d/release.json" "out/$name.release.json"
          tar -C out -czf "out/$name.tar.gz" "$name"
          (cd out && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          # The launcher on its own, for its self-update (selfupdate.rs update_rust_binary).
          cp target/release/skate-launcher "out/skate-launcher-${{ inputs.target }}"
          (cd out && shasum -a 256 "skate-launcher-${{ inputs.target }}" > "skate-launcher-${{ inputs.target }}.sha256")
      # Patch updates: the patch from the rolling package on the release now to this one, and the index of the links
      # an install can chain. Any failure leaves no patch: launchers take the full download.
      - name: Patch from the previous rolling build
        if: github.event_name != 'release' && github.ref == 'refs/heads/hails-additions'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name=skate3rust-${{ inputs.target }}
          mkdir -p out/prev out/patches
          if ! gh release download hails-additions --repo "$GITHUB_REPOSITORY" -p "$name.tar.gz" -D out/prev; then
            echo 'No previous rolling package: no patch.'; exit 0
          fi
          gh release download hails-additions --repo "$GITHUB_REPOSITORY" -p "$name.patches.json" -D out/prev || true
          set -- make-patch --old "out/prev/$name.tar.gz" --new "out/$name.tar.gz" --out out/patches --keep 5 \
            --package-size "$(wc -c < "out/$name.tar.gz" | tr -d ' ')"
          [ -f "out/prev/$name.patches.json" ] && set -- "$@" --index "out/prev/$name.patches.json"
          if ! target/release/skate-launcher "$@"; then
            echo '::warning::No patch for this build (make-patch failed); launchers take the full download.'
            rm -f out/patches/*
          fi
          rm -rf out/prev
      - name: Report compiler cache hits
        if: always()
        run: sccache --show-stats
      - uses: actions/upload-artifact@v7
        with:
          name: skate3rust-${{ inputs.target }}
          retention-days: 7
          path: |
            out/skate3rust-${{ inputs.target }}.tar.gz
            out/skate3rust-${{ inputs.target }}.tar.gz.sha256
            out/skate3rust-${{ inputs.target }}.release.json
            out/skate-launcher-${{ inputs.target }}
            out/skate-launcher-${{ inputs.target }}.sha256
            out/patches/
  publish:
    needs: build
    if: github.event_name == 'release' || github.ref == 'refs/heads/hails-additions'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: skate3rust-${{ inputs.target }}
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || 'hails-additions' }}
        run: |
          name=skate3rust-${{ inputs.target }}
          index="patches/$name.patches.json"
          # the patch and its index go up before the package, so a launcher that sees the new release.json finds them
          if [ "$TAG" = hails-additions ] && [ -f "$index" ]; then gh release upload "$TAG" patches/* --clobber --repo "$GITHUB_REPOSITORY"; fi
          gh release upload "$TAG" "$name.tar.gz" "$name.tar.gz.sha256" skate-launcher-${{ inputs.target }} skate-launcher-${{ inputs.target }}.sha256 --clobber --repo "$GITHUB_REPOSITORY"
          # the release.json last: a launcher that sees it finds the package it describes
          gh release upload "$TAG" "$name.release.json" --clobber --repo "$GITHUB_REPOSITORY"
          # links that fell out of the index (more than 5 builds old) are removed
          if [ "$TAG" = hails-additions ] && [ -f "$index" ]; then
            keep=$(jq -r '.links[].file' "$index")
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -E "^$name\..+\.patch\$" | while read -r a; do
              grep -qxF "$a" <<< "$keep" || gh release delete-asset "$TAG" "$a" --yes --repo "$GITHUB_REPOSITORY"
            done
          fi
