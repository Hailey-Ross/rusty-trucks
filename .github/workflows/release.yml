name: Windows release
on:
  push:
    branches: ['**']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release to build for and attach the package to (empty: a branch build)'
        required: false
        default: ''
permissions:
  contents: read
env:
  # Forks build, publish and update from their own repository.
  SKATE3RUST_REPOSITORY: ${{ github.repository }}
jobs:
  windows:
    if: github.event_name != 'release' || github.event.release.tag_name != 'experimental'
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      SCCACHE_GHA_ENABLED: "true"
    concurrency:
      group: windows-build-${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/requirements-setup.txt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-release
          cache-on-failure: true
      # Cargo's dependency cache excludes our vendored Bevy crates. Cache their
      # compiler outputs by content as well, independent of checkout timestamps.
      - uses: mozilla-actions/sccache-action@v0.0.11
      # sccache 0.19.0 with .github/sccache's patch (os error 206 on long rustc lines; see rusty-trucks-win.yml).
      - id: sccache-patched
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sccache-patched
          key: sccache-0.19.0-${{ hashFiles('.github/sccache/*.patch') }}
      - name: Build patched sccache
        if: steps.sccache-patched.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git -c core.autocrlf=false clone --quiet --depth 1 --branch v0.19.0 https://github.com/mozilla/sccache.git "$env:RUNNER_TEMP/sccache-src"
          git -C "$env:RUNNER_TEMP/sccache-src" apply "$env:GITHUB_WORKSPACE/.github/sccache/0001-rustc-response-file.patch"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cargo install --locked --path "$env:RUNNER_TEMP/sccache-src" --root "$env:RUNNER_TEMP/sccache-patched" --no-default-features --features gha
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Use patched sccache
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "$env:RUNNER_TEMP\sccache-patched\bin"
      - name: Check publisher without starting game
        run: python -m unittest discover -s tools -p "test_*release*.py" -v
      - name: Check isolated asset refresh and failure recovery
        run: python -m unittest tools.asset_pipeline.test_versions -v
      - name: Build Windows package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag || 'experimental' }}
          RUSTC_WRAPPER: sccache
        run: ./scripts/Build-Release.ps1
      - name: Report compiler cache hits
        if: always()
        shell: pwsh
        run: sccache --show-stats
      - uses: actions/upload-artifact@v4
        with:
          name: skate3rust-windows-x64
          retention-days: 7
          path: |
            target/skate3rust-windows-x64.zip
            target/skate3rust-windows-x64.zip.sha256
            target/release.json
  publish:
    needs: windows
    if: github.event_name == 'release' || inputs.release_tag != '' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/skyline-driving-update'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: windows-release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: skate3rust-windows-x64
          path: target
      - name: Publish rolling experimental
        if: github.event_name != 'release' && inputs.release_tag == '' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish_experimental.py --directory target
      - name: Publish branch release
        if: github.event_name != 'release' && inputs.release_tag == '' && github.ref == 'refs/heads/skyline-driving-update'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish_branch.py --directory target --branch skyline-driving-update
      - name: Attach numbered release
        if: github.event_name == 'release' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" target/skate3rust-windows-x64.zip target/skate3rust-windows-x64.zip.sha256 target/release.json --clobber
