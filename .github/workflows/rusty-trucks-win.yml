# Rusty Trucks Windows build for Hailey-Ross/rusty-trucks: builds only hails-additions (push), its releases and
# manual runs. The shared release.yml is disabled on the fork so other branches never build there.
name: Rusty Trucks Windows build
on:
  push:
    branches: [hails-additions]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release to build for and attach the package to (empty: the rolling hails-additions build)'
        required: false
        default: ''
permissions:
  contents: read
env:
  SKATE3RUST_REPOSITORY: ${{ github.repository }}
jobs:
  windows:
    if: github.repository == 'Hailey-Ross/rusty-trucks' && (github.event_name != 'release' || github.event.release.tag_name != 'experimental')
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      SCCACHE_GHA_ENABLED: "true"
    concurrency:
      group: fork-build-${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/requirements-setup.txt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-release
          cache-on-failure: true
      # Cargo's dependency cache excludes our vendored Bevy crates. Cache their
      # compiler outputs by content as well, independent of checkout timestamps.
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Check publisher without starting game
        run: python -m unittest discover -s tools -p "test_*release*.py" -v
      - name: Check isolated asset refresh and failure recovery
        run: python -m unittest tools.asset_pipeline.test_versions -v
      - name: Build Windows package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag || 'experimental' }}
          # sccache expands cargo's @argfile and spawns rustc with the full line; cargo's build-dir layout puts one
          # -L path per dependency on it (bevy_internal: 312), past Windows' 32,767 limit under target\ (os error 206,
          # mozilla/sccache#2397). A short build folder keeps that line near 28,600 characters. Drop it once an sccache
          # release has the fix (mozilla/sccache#3026).
          RUSTC_WRAPPER: sccache
          CARGO_BUILD_BUILD_DIR: D:\b
        run: ./scripts/Build-Release.ps1
      # The launcher's prebuilt exe (USER-ASKS 463): build.bat and the launcher's self-update download it when the
      # sidecar names their SkateLauncher.cs (sha256 of the text without CR), else they compile it themselves.
      - name: Build SkateLauncher.exe
        shell: pwsh
        run: |
          & "$env:WINDIR/Microsoft.NET/Framework64/v4.0.30319/csc.exe" /nologo /target:winexe "/out:target\SkateLauncher.exe" "tools\steam-launcher\SkateLauncher.cs"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $text = [IO.File]::ReadAllText("$PWD/tools/steam-launcher/SkateLauncher.cs", [Text.Encoding]::UTF8).Replace("`r", '')
          $source = ([BitConverter]::ToString([Security.Cryptography.SHA256]::Create().ComputeHash([Text.Encoding]::UTF8.GetBytes($text))) -replace '-', '').ToLower()
          $exe = (Get-FileHash target/SkateLauncher.exe -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD/target/SkateLauncher.exe.source-sha256", "source $source`nexe $exe`n")
      # The new launcher (tools/skate-launcher, doc 44): Tools > Try the new launcher puts it in place of
      # SkateLauncher.exe, and it updates itself from this file (checked by its sha256). The C runtime is linked in,
      # so it needs nothing installed; its own target folder keeps the game build's cache untouched.
      - name: Build the new launcher
        shell: pwsh
        env:
          RUSTC_WRAPPER: sccache
          RUSTFLAGS: -C target-feature=+crt-static
          CARGO_TARGET_DIR: target/launcher-build
        run: |
          cargo build --release --locked -p skate-launcher
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item target/launcher-build/release/skate-launcher.exe target/skate-launcher-windows-x64.exe
          $h = (Get-FileHash target/skate-launcher-windows-x64.exe -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD/target/skate-launcher-windows-x64.exe.sha256", "$h  skate-launcher-windows-x64.exe`n")
      # Patch updates (doc 44a "Patch updates"): the patch from the rolling build on the release now to this one, plus
      # the index of the links an install can chain. A launcher on the previous build downloads only the patch. Any
      # failure here leaves no patch: launchers take the full download as before.
      - name: Patch from the previous rolling build
        if: github.event_name != 'release' && inputs.release_tag == ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force target/prev, target/patches | Out-Null
          gh release download hails-additions --repo $env:GITHUB_REPOSITORY -p skate3rust-windows-x64.zip -D target/prev
          if ($LASTEXITCODE -ne 0) { Write-Output 'No previous rolling package: no patch.'; exit 0 }
          gh release download hails-additions --repo $env:GITHUB_REPOSITORY -p skate3rust-windows-x64.patches.json -D target/prev
          $make = @('make-patch', '--old', 'target/prev/skate3rust-windows-x64.zip', '--new', 'target/skate3rust-windows-x64.zip',
            '--out', 'target/patches', '--keep', '5', '--package-size', "$((Get-Item target/skate3rust-windows-x64.zip).Length)")
          if (Test-Path target/prev/skate3rust-windows-x64.patches.json) { $make += @('--index', 'target/prev/skate3rust-windows-x64.patches.json') }
          # a windowed program: piping its output makes PowerShell wait for it and set its exit code
          & target/skate-launcher-windows-x64.exe @make | ForEach-Object { $_ }
          if ($LASTEXITCODE -ne 0) {
            Write-Output '::warning::No patch for this build (make-patch failed); launchers take the full download.'
            Remove-Item target/patches/* -ErrorAction SilentlyContinue
          }
          Remove-Item target/prev -Recurse -Force
          exit 0
      - name: Report compiler cache hits
        if: always()
        shell: pwsh
        run: sccache --show-stats
      - uses: actions/upload-artifact@v7
        with:
          name: skate3rust-windows-x64
          retention-days: 7
          path: |
            target/skate3rust-windows-x64.zip
            target/skate3rust-windows-x64.zip.sha256
            target/release.json
            target/SkateLauncher.exe
            target/SkateLauncher.exe.source-sha256
            target/skate-launcher-windows-x64.exe
            target/skate-launcher-windows-x64.exe.sha256
            target/patches/
  publish:
    needs: windows
    if: github.repository == 'Hailey-Ross/rusty-trucks' && (github.event_name == 'release' || inputs.release_tag != '' || github.ref == 'refs/heads/hails-additions')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: fork-release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: skate3rust-windows-x64
          path: target
      # The launcher-only download (tools/steam-launcher/README.md, "Launcher-only download"): the launcher's own
      # files plus STANDALONE.txt, no game build. Kept out of target/ so the player package steps never see it.
      - name: Package launcher-only download
        run: |
          set -e
          d=launcher-out/skate-launcher
          mkdir -p "$d"
          (cd tools/steam-launcher && cp SkateLauncher.cs build.bat launcher.bat launcher.ps1 setup.ps1 README.md config.example.json versions.example.json setup.sh "../../$d/")
          # Every OS: INSTALL.bat / install.ps1 (Windows), install.sh / INSTALL.command (Linux, macOS) download this
          # OS's Skate launcher from the release, run the first-time setup and start it.
          cp tools/steam-launcher/standalone/* "$d/"
          cp tools/second-pc/share-session-issue.ps1 "$d/"
          printf 'Standalone launcher: its config, state and versions stay in this folder (README.md).\n' > "$d/STANDALONE.txt"
          printf 'build %s\ncommit %s\n' "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" > "$d/LAUNCHER-VERSION.txt"
          # Windows files get CRLF; the shell scripts stay LF (a CR breaks sh).
          for f in "$d"/*; do case "$f" in *.sh|*.command) sed -i 's/\r$//' "$f";; *) sed -i 's/\r$//; s/$/\r/' "$f";; esac; done
          chmod +x "$d/install.sh" "$d/INSTALL.command" "$d/setup.sh"
          (cd launcher-out && zip -qr skate-launcher.zip skate-launcher && sha256sum skate-launcher.zip > skate-launcher.zip.sha256)
      - name: Publish rolling hails-additions prerelease
        if: github.event_name != 'release' && inputs.release_tag == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the patch and its index go up before the package, so a launcher that sees the new release.json finds them
          index=target/patches/skate3rust-windows-x64.patches.json
          if [ -f "$index" ]; then gh release upload hails-additions target/patches/* --clobber; fi
          python tools/publish_branch.py --directory target --branch hails-additions --notes-file docs/hails-additions/RELEASE-NOTES.md
          # links that fell out of the index (more than 5 builds old) are removed
          if [ -f "$index" ]; then
            keep=$(jq -r '.links[].file' "$index")
            gh release view hails-additions --json assets -q '.assets[].name' | grep -E '^skate3rust-windows-x64\..+\.patch$' | while read -r a; do
              grep -qxF "$a" <<< "$keep" || gh release delete-asset hails-additions "$a" --yes
            done
          fi
          gh release upload hails-additions launcher-out/skate-launcher.zip launcher-out/skate-launcher.zip.sha256 --clobber
          gh release upload hails-additions target/SkateLauncher.exe target/SkateLauncher.exe.source-sha256 --clobber
          gh release upload hails-additions target/skate-launcher-windows-x64.exe target/skate-launcher-windows-x64.exe.sha256 --clobber
      - name: Attach release package
        if: github.event_name == 'release' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" target/skate3rust-windows-x64.zip target/skate3rust-windows-x64.zip.sha256 target/release.json launcher-out/skate-launcher.zip launcher-out/skate-launcher.zip.sha256 --clobber
